<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>El Dios Olvidado</title>
<style>
:root{--gold:#d8b56d;--red:#a82d3a;--panel:rgba(13,15,22,.94);--line:#766344}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:#eee;font-family:Georgia,"Times New Roman",serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}
#brand{position:absolute;top:15px;left:18px;color:var(--gold);font-size:clamp(15px,2vw,22px);letter-spacing:3px}
#bars{position:absolute;top:48px;left:18px;width:min(280px,48vw)}
.bar{height:13px;border:1px solid #b3a17a;background:#19151b;margin:5px 0;position:relative;box-shadow:0 0 10px #000}
.fill{height:100%;width:100%;transition:width .15s}.hp{background:linear-gradient(90deg,#681b2b,#d7444e)}.en{background:linear-gradient(90deg,#174d75,#54c8e8)}.xp{background:linear-gradient(90deg,#74602a,#e4cb78)}
.bar label{position:absolute;inset:-2px 5px;font:10px Arial,sans-serif;line-height:13px;letter-spacing:1px}
#stats{font:12px Arial,sans-serif;color:#e2d7bd;margin-top:6px}
#objective{position:absolute;top:18px;right:20px;text-align:right;max-width:270px;color:#e6d7b7;font:14px Arial,sans-serif}
#hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 15px;background:#090b11c9;border:1px solid #66573e;color:#f4dfae;font:13px Arial,sans-serif;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#bossHud{display:none;position:absolute;top:78px;left:50%;transform:translateX(-50%);width:min(390px,75vw);text-align:center}
#bossName{font-size:16px;letter-spacing:2px;color:#f0d7a2;margin-bottom:6px}
#bossBar{height:12px;border:1px solid #b18d65;background:#21151a}.bossFill{height:100%;width:100%;background:linear-gradient(90deg,#5b1424,#d3454b)}
#toast{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);color:#f2dca4;font-size:clamp(18px,3vw,32px);text-align:center;letter-spacing:2px;opacity:0;transition:opacity .35s;text-shadow:0 0 15px #c13c48}
#panel{display:none;pointer-events:auto;position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(25,22,30,.92),rgba(3,4,8,.97));z-index:5;align-items:center;justify-content:center;padding:16px}
.window{width:min(760px,96vw);max-height:90vh;overflow:auto;border:1px solid var(--line);background:linear-gradient(145deg,#191922f7,#090b11f7);box-shadow:0 0 55px #000;padding:clamp(18px,4vw,34px);position:relative}
h1,h2{color:var(--gold);font-weight:normal;letter-spacing:3px;margin:0 0 12px}h1{font-size:clamp(30px,6vw,58px);text-align:center}h2{font-size:clamp(21px,4vw,30px)}p{line-height:1.5;color:#d0c8ba}
button{font:15px Georgia,serif;color:#f1e5c8;background:linear-gradient(#34303a,#17171e);border:1px solid #796747;padding:11px 15px;cursor:pointer;transition:.15s;margin:4px;min-height:40px}
button:hover{background:linear-gradient(#594536,#28202a);border-color:#e3c47b;transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed;transform:none}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:16px}.eyebrow{text-align:center;color:#b8a77f;letter-spacing:4px;font:11px Arial,sans-serif;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.item{border:1px solid #514734;padding:12px;background:#11131a}.item strong{color:#e1c47d}.small{font:12px Arial,sans-serif;color:#a9a39a}.dialogue{font-size:17px;min-height:70px}.choice{display:block;width:100%;text-align:left}.hidden{display:none!important}
#mobile{position:fixed;bottom:18px;left:14px;right:14px;display:none;pointer-events:none;z-index:3}
#stick{width:115px;height:115px;border-radius:50%;border:1px solid #bba16c88;background:#11131a99;pointer-events:auto;touch-action:none;position:relative}
#nub{position:absolute;width:42px;height:42px;border-radius:50%;left:36px;top:36px;background:#bda66b88;border:1px solid #e5d2a0}
.mobBtns{position:absolute;right:0;bottom:0;display:grid;grid-template-columns:repeat(2,60px);gap:7px;pointer-events:auto}
.mobBtns button{width:60px;height:53px;margin:0;padding:3px;background:#17151bd9}
@media(pointer:coarse){#mobile{display:block}#hint{bottom:145px}#objective{top:12px;right:12px;font-size:12px}#brand{top:12px;left:12px}#bars{top:40px;left:12px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="brand">EL DIOS OLVIDADO</div>
 <div id="bars">
  <div class="bar"><div id="healthFill" class="fill hp"></div><label id="healthText">SALUD</label></div>
  <div class="bar"><div id="energyFill" class="fill en"></div><label id="energyText">ESENCIA</label></div>
  <div class="bar"><div id="xpFill" class="fill xp"></div><label id="xpText">EXPERIENCIA</label></div>
  <div id="stats">NIVEL 1 · ESPADA ROTA</div>
 </div>
 <div id="objective">OBJETIVO<br><span id="objectiveText">Habla con Eryon (E)</span></div>
 <div id="bossHud"><div id="bossName">GUARDIÁN</div><div id="bossBar"><div id="bossFill" class="bossFill"></div></div></div>
 <div id="toast"></div><div id="hint">WASD mover · Clic atacar · ESPACIO esquivar · Q esencia · E interactuar · I inventario · J misiones · K habilidades · ESC pausa · F pantalla completa</div>
</div>
<div id="panel"><div class="window" id="window"></div></div>
<div id="mobile"><div id="stick"><div id="nub"></div></div><div class="mobBtns"><button data-act="attack">⚔</button><button data-act="dodge">ESQ</button><button data-act="power">Q</button><button data-act="interact">E</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const TILE=48, MAPW=46, MAPH=34;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rand=(a,b)=>a+Math.random()*(b-a);
let keys={},mouse={x:W/2,y:H/2,down:false},last=0,cam={x:0,y:0},shake=0,particles=[],texts=[],enemies=[],objects=[],npcs=[],audio=null,scene='menu',panel=null,toastTimer=0,dialogue=null,dialogueIndex=0,worldTime=0;
const map=Array.from({length:MAPH},(_,y)=>Array.from({length:MAPW},(_,x)=>({wall:x===0||y===0||x===MAPW-1||y===MAPH-1||((x===11||x===12)&&y>4&&y<13)||((y===17)&&x>20&&x<30)||((x===29)&&y>18&&y<27)||((x===6)&&y>20&&y<26),type:Math.random()})));
for(let x=2;x<MAPW-2;x++){map[15][x].wall=false;map[16][x].wall=false}
for(let y=2;y<MAPH-2;y++){map[y][22].wall=false;map[y][23].wall=false}
function solidAt(x,y){let tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);return tx<0||ty<0||tx>=MAPW||ty>=MAPH||map[ty][tx].wall}
const player={x:5*TILE,y:15*TILE,r:12,hp:100,maxHp:100,en:60,maxEn:60,level:1,xp:0,nextXp:60,damage:22,speed:180,faceX:1,faceY:0,attack:0,attackCd:0,dodge:0,dodgeCd:0,invuln:0,hit:0,dead:false,roots:0,rootCd:0,levelPoints:0,coins:0};
let game={region:'Aldea de Ceniza',bossDefeated:false,eryonMet:false,merchantQuest:false,spiritQuest:false,memories:0,secretCompassion:0,choice:'',saved:false,story:0,weapon:'Espada rota',armor:'Armadura deteriorada',potions:2,inventory:[{name:'Poción carmesí',desc:'Restaura 45 de salud.',type:'Consumible',count:2},{name:'Fragmento divino',desc:'Un trozo de una memoria celestial.',type:'Reliquia',count:1}],skills:[],quests:[{name:'La noche roja',desc:'Habla con Eryon y sobrevive al primer ataque.',state:'Activa'},{name:'Ecos entre las ruinas',desc:'Encuentra los tres recuerdos brillantes del bosque.',state:'Disponible'}],settings:{music:.25,sfx:.5,reduce:false,text:16},bosses:[],ending:null};
function safeSave(){try{localStorage.setItem('forgottenGodSave',JSON.stringify({player:{x:player.x,y:player.y,hp:player.hp,en:player.en,level:player.level,xp:player.xp,nextXp:player.nextXp,damage:player.damage,levelPoints:player.levelPoints,coins:player.coins},game}));game.saved=true;notify('PARTIDA GUARDADA')}catch(e){notify('No se pudo guardar en este navegador')}}
function loadSave(){try{let d=JSON.parse(localStorage.getItem('forgottenGodSave'));if(!d||!d.player||!d.game)return false;Object.assign(player,d.player);game=Object.assign(game,d.game);return true}catch(e){return false}}
function validSave(){try{let d=JSON.parse(localStorage.getItem('forgottenGodSave'));return !!(d&&d.player&&d.game)}catch(e){return false}}
function notify(s){let t=$('toast');t.textContent=s;t.style.opacity=1;toastTimer=2.2}
function audioStart(){if(audio)return;try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();}catch(e){}}
function tone(freq,dur,type='sine',vol=.04,slide=0){if(!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function sound(kind){if(!audio||game.settings.sfx===0)return;let v=game.settings.sfx;if(kind==='hit'){tone(125,.12,'sawtooth',.06*v,-75)}if(kind==='sword'){tone(340,.1,'triangle',.045*v,220)}if(kind==='magic'){tone(230,.35,'sine',.06*v,450)}if(kind==='pickup'){tone(550,.22,'sine',.05*v,400)}if(kind==='hurt'){tone(85,.22,'square',.035*v,-35)}if(kind==='level'){tone(360,.55,'triangle',.05*v,520)}}
function addParticle(x,y,color,n=8,force=90){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),s=rand(force*.25,force);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7),max:.7,color,size:rand(2,5)})}}
function floatText(x,y,text,color='#f5dca0'){texts.push({x,y,text,color,life:1})}
function makeEnemy(x,y,type='hollow',boss=false){let cfg=type==='brute'?{hp:90,damage:17,speed:65,r:17,xp:28}:{hp:48,damage:10,speed:85,r:12,xp:16};if(boss)cfg={hp:500,damage:20,speed:62,r:28,xp:160};return {x,y,r:cfg.r,type,boss,hp:cfg.hp,maxHp:cfg.hp,damage:cfg.damage,speed:cfg.speed,xp:cfg.xp,state:'patrol',timer:rand(0,1),attackCd:rand(.4,1.2),hit:0,dead:false,phase:1,rooted:0,faceX:-1,faceY:0,flash:0}}
function spawnWorld(){enemies=[];objects=[];npcs=[];for(let i=0;i<13;i++){let x=rand(8,20)*TILE,y=rand(5,28)*TILE;if(!solidAt(x,y))enemies.push(makeEnemy(x,y,i%4===0?'brute':'hollow'))}npcs.push({x:6*TILE,y:15*TILE-70,name:'Eryon',kind:'eryon'});npcs.push({x:8*TILE,y:15*TILE+75,name:'Mara, la comerciante',kind:'merchant'});npcs.push({x:18*TILE,y:10*TILE,name:'Espíritu sin nombre',kind:'spirit'});for(let i=0;i<3;i++)objects.push({x:(15+i*2)*TILE,y:(7+i*5)*TILE,type:'memory',taken:false});objects.push({x:21*TILE,y:15*TILE,type:'chest',taken:false});objects.push({x:26*TILE,y:15*TILE,type:'altar',taken:false});objects.push({x:31*TILE,y:15*TILE,type:'bossGate',taken:false});}
spawnWorld();
function startNew(){player.x=5*TILE;player.y=15*TILE;player.hp=100;player.en=60;player.level=1;player.xp=0;player.nextXp=60;player.damage=22;player.levelPoints=0;player.coins=0;player.dead=false;game={region:'Aldea de Ceniza',bossDefeated:false,eryonMet:false,merchantQuest:false,spiritQuest:false,memories:0,secretCompassion:0,choice:'',saved:false,story:0,bosses:[],ending:null,weapon:'Espada rota',armor:'Armadura deteriorada',potions:2,inventory:[{name:'Poción carmesí',desc:'Restaura 45 de salud.',type:'Consumible',count:2},{name:'Fragmento divino',desc:'Un trozo de una memoria celestial.',type:'Reliquia',count:1}],skills:[],quests:[{name:'La noche roja',desc:'Habla con Eryon y sobrevive al primer ataque.',state:'Activa'},{name:'Ecos entre las ruinas',desc:'Encuentra los tres recuerdos brillantes del bosque.',state:'Disponible'}],settings:{music:.25,sfx:.5,reduce:false,text:16}};spawnWorld();scene='game';closePanel();beginDialogue('Eryon','El eclipse ya ha comenzado. Si todavía puedes sostener esa espada, quizá el mundo conserve una última esperanza.');}
function beginDialogue(name,text,choices=null,callback=null){dialogue={name,text,choices,callback};dialogueIndex=0;showDialogue()}
function showDialogue(){if(!dialogue)return;panel='dialogue';$('panel').style.display='flex';let w=$('window');w.innerHTML=`<div class="eyebrow">ECOS DEL PASADO</div><h2>${escapeHtml(dialogue.name)}</h2><div class="dialogue" id="dialogueText"></div><div id="dialogueChoices" class="actions"></div><div class="small">E / ENTER para continuar · ESC para cerrar</div>`;typeDialogue(dialogue.text);if(dialogue.choices){let box=$('dialogueChoices');dialogue.choices.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.label;b.className='choice';b.onclick=()=>{let cb=dialogue.callback;let val=c.value;closePanel();dialogue=null;if(cb)cb(val)};box.appendChild(b)})}}
function typeDialogue(text){let el=$('dialogueText');let i=0;el.textContent='';let step=()=>{if(!el||!el.isConnected)return;i=Math.min(text.length,i+3);el.textContent=text.slice(0,i);if(i<text.length)setTimeout(step,18)};step()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closePanel(){const oldPanel=panel;panel=null;$('panel').style.display='none';$('window').innerHTML='';if(scene==='game')canvas.focus?.();else if(scene==='menu'&&oldPanel!=='title')showTitle()}
function showPanel(kind){if(scene!=='game'&&!(scene==='menu'&&(kind==='options'||kind==='credits')))return;panel=kind;$('panel').style.display='flex';const w=$('window');if(kind==='pause'){w.innerHTML=`<div class="eyebrow">EL MUNDO ESPERA</div><h2 style="text-align:center">PAUSA</h2><p style="text-align:center">La oscuridad no se detiene. Tú sí puedes.</p><div class="actions"><button onclick="window.resumeGame()">Continuar</button><button onclick="window.openInventory()">Inventario</button><button onclick="window.openQuests()">Misiones</button><button onclick="window.openSkills()">Habilidades</button><button onclick="window.openOptions()">Opciones</button><button onclick="window.saveGame()">Guardar partida</button><button onclick="window.goTitle()">Menú principal</button></div>`}
else if(kind==='inventory')renderInventory();else if(kind==='quests')renderQuests();else if(kind==='skills')renderSkills();else if(kind==='options')renderOptions();else if(kind==='credits')w.innerHTML='<div class="eyebrow">CRÉDITOS</div><h2>EL DIOS OLVIDADO</h2><p>Un pequeño RPG de fantasía oscura. Código, mundo y audio generados localmente para esta experiencia.</p><div class="actions"><button onclick="window.goTitle()">Volver</button></div>'; }
function renderInventory(){let w=$('window');let items=game.inventory||[];w.innerHTML=`<div class="eyebrow">EQUIPO Y RECUERDOS</div><h2>Inventario</h2><p>Monedas: ${player.coins} · Pociones: ${game.potions||0} · Arma: ${escapeHtml(game.weapon||'Espada rota')}</p><div class="grid" id="items"></div><div class="actions"><button onclick="window.usePotion()">Usar poción (+45 salud)</button><button onclick="window.equipSword()">Reforjar espada (30 monedas)</button><button onclick="window.closePanel()">Cerrar</button></div>`;let box=w.querySelector('#items');items.forEach(it=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<strong>${escapeHtml(it.name)}</strong><p>${escapeHtml(it.desc)}</p><span class="small">${escapeHtml(it.type||'Objeto')} · x${it.count||1}</span>`;box.appendChild(d)})}
function renderQuests(){let w=$('window');w.innerHTML='<div class="eyebrow">DIARIO DEL VIAJERO</div><h2>Registro de misiones</h2><div class="grid" id="quests"></div><div class="actions"><button onclick="window.closePanel()">Cerrar</button></div>';let box=w.querySelector('#quests');game.quests.forEach(q=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<strong>${escapeHtml(q.name)}</strong><p>${escapeHtml(q.desc)}</p><span class="small">Estado: ${escapeHtml(q.state)}</span>`;box.appendChild(d)})}
function renderSkills(){let w=$('window');w.innerHTML=`<div class="eyebrow">EL PODER TIENE UN PRECIO</div><h2>Habilidades</h2><p>Puntos disponibles: ${player.levelPoints}</p><div class="grid"><div class="item"><strong>Filo espectral</strong><p>+5 daño permanente por punto.</p><button ${player.levelPoints<1?'disabled':''} onclick="window.buySkill('damage')">Mejorar · 1 punto</button></div><div class="item"><strong>Corazón de ceniza</strong><p>+15 salud máxima y recuperación.</p><button ${player.levelPoints<1?'disabled':''} onclick="window.buySkill('health')">Mejorar · 1 punto</button></div><div class="item"><strong>Vasija profunda</strong><p>+12 esencia máxima.</p><button ${player.levelPoints<1?'disabled':''} onclick="window.buySkill('energy')">Mejorar · 1 punto</button></div></div><div class="actions"><button onclick="window.closePanel()">Cerrar</button></div>`}
function renderOptions(){let w=$('window');w.innerHTML=`<div class="eyebrow">AJUSTES</div><h2>Opciones</h2><div class="item"><label>Música <input id="musicVol" type="range" min="0" max="1" step=".05" value="${game.settings.music}"></label></div><div class="item"><label>Efectos <input id="sfxVol" type="range" min="0" max="1" step=".05" value="${game.settings.sfx}"></label></div><div class="item"><label><input id="reduceFx" type="checkbox" ${game.settings.reduce?'checked':''}> Reducir vibración y efectos</label></div><p class="small">El audio comienza tras una interacción. La partida se guarda localmente en este navegador.</p><div class="actions"><button onclick="window.applyOptions()">Aplicar</button><button onclick="window.closePanel()">Cerrar</button><button onclick="window.eraseSave()">Borrar partida guardada</button></div>`}
window.resumeGame=()=>closePanel();window.closePanel=closePanel;window.openInventory=()=>showPanel('inventory');window.openQuests=()=>showPanel('quests');window.openSkills=()=>showPanel('skills');window.openOptions=()=>showPanel('options');window.saveGame=safeSave;
window.usePotion=()=>{if((game.potions||0)>0&&player.hp<player.maxHp){game.potions--;player.hp=Math.min(player.maxHp,player.hp+45);sound('pickup');notify('Poción utilizada');renderInventory()}else notify('No puedes usar una poción ahora')};
window.equipSword=()=>{if(player.coins>=30&&game.weapon!=='Espada del alba rota'){player.coins-=30;player.damage+=9;game.weapon='Espada del alba rota';notify('La espada ha sido reforjada');renderInventory();safeSave()}else notify(player.coins<30?'Necesitas 30 monedas':'Ya tienes esta mejora')};
window.buySkill=(type)=>{if(player.levelPoints<1)return;player.levelPoints--;game.skills.push(type);if(type==='damage')player.damage+=5;if(type==='health'){player.maxHp+=15;player.hp+=15}if(type==='energy')player.maxEn+=12;renderSkills();sound('level')};
window.applyOptions=()=>{game.settings.music=+$('musicVol').value;game.settings.sfx=+$('sfxVol').value;game.settings.reduce=$('reduceFx').checked;closePanel();safeSave()};
window.eraseSave=()=>{if(confirm('¿Borrar definitivamente la partida guardada?')){localStorage.removeItem('forgottenGodSave');notify('Guardado eliminado');renderOptions()}};
window.goTitle=()=>{closePanel();scene='menu';showTitle()};
function showTitle(){scene='menu';$('bossHud').style.display='none';$('panel').style.display='flex';panel='title';$('window').innerHTML=`<div class="eyebrow">UNA HISTORIA ESCRITA EN CENIZA</div><h1>EL DIOS<br>OLVIDADO</h1><p style="text-align:center;max-width:510px;margin:15px auto">Siete dioses. Siete sellos. Una verdad enterrada bajo un eclipse rojo.</p><div class="actions"><button onclick="window.newGame()">Nueva partida</button><button ${validSave()?'':'disabled'} onclick="window.continueGame()">Continuar</button><button onclick="window.openTitleOptions()">Opciones</button><button onclick="window.showCredits()">Créditos</button></div><p class="small" style="text-align:center;margin-top:18px">WASD mover · Ratón atacar · Q poder · E interactuar · F pantalla completa</p>`}
window.newGame=()=>{audioStart();startNew()};window.continueGame=()=>{audioStart();if(loadSave()){spawnWorld();scene='game';closePanel();notify('La memoria regresa…')}else notify('No hay una partida válida')};
window.openTitleOptions=()=>{audioStart();showPanel('options')};window.showCredits=()=>showPanel('credits');
function interact(){if(panel){if(dialogue){if(dialogue.choices)return;closePanel();dialogue=null;return}if(panel==='dialogue')return;closePanel();return}
let nearest=null,nd=75;for(let n of npcs){let d=dist(player,n);if(d<nd){nd=d;nearest=n}}for(let o of objects){if(o.taken)continue;let d=dist(player,o);if(d<nd){nd=d;nearest=o}}
if(!nearest){notify('No hay nada con lo que interactuar');return}
if(nearest.kind==='eryon'){game.eryonMet=true;game.quests[0].state='Completada';game.quests[1].state='Activa';beginDialogue('Eryon',game.bossDefeated?'Has devuelto una esencia al mundo. Pero esto apenas comienza.':'La aldea cayó en una sola noche. Busca los recuerdos del bosque y sigue el camino al santuario. No confíes en las voces que prometen devolverte lo perdido.');return}

const stick=$('stick'),nub=$('nub');let stickPointer=null;stick.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)stickMove(e)});stick.addEventListener('pointerup',e=>{if(e.pointerId===stickPointer){stickPointer=null;keys.w=keys.a=keys.s=keys.d=false;nub.style.left='36px';nub.style.top='36px'}});function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.hypot(x,y),m=Math.min(34,l);if(l){x=x/l*m;y=y/l*m}nub.style.left=(36+x)+'px';nub.style.top=(36+y)+'px';keys.d=x>10;keys.a=x< -10;keys.s=y>10;keys.w=y< -10}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='game'&&!panel)showPanel('pause')});
$('panel').addEventListener('click',e=>{if(e.target===$('panel')&&panel!=='title')closePanel()});
showTitle();requestAnimationFrame(loop);
